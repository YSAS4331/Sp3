<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更新履歴 - Splatoon3 Battle Logger</title>

  <link rel="stylesheet" href="/Sp3/style.css">
  <link rel="stylesheet" href="./style.css" data-page>

  <link rel="icon" href="/imgs/favicon.png">
</head>
<body>
  <div id="aside-backdrop"></div>
  <sp3-header></sp3-header>
  <div id="app">
    <sp3-aside></sp3-aside>
    <main>
      <h2>更新履歴</h2>
        <section>
          <h3>ver 1.0.0（2026-05-10）</h3>
          <ul class="changelog">
            <li>
              <span class="version">初期リリース</span>
              <p>Splatoon3 Battle Logger の最初の安定版を公開しました。</p>
            </li>
            <li>
              <span class="version">バトルログ管理</span>
              <p>対戦データの登録・編集・削除に対応。</p>
            </li>
            <li>
              <span class="version">武器辞書の自動補完</span>
              <p>武器名の入力補助と内部辞書の参照機能を実装。</p>
            </li>
            <li>
              <span class="version">IndexedDB 保存</span>
              <p>ブラウザ内にデータを安全に保存し、再読み込みしても保持されます。</p>
            </li>
            <li>
              <span class="version">エクスポート / インポート</span>
              <p>JSON 形式でバックアップ・復元が可能。</p>
            </li>
          </ul>
        </section>
    </main>
  </div>
  <script type="module" src="/Sp3/load.js"></script>
</body>
</html>
